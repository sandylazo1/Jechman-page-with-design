<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada &middot; JECHMAN</title>
  <link rel="icon" href="assets/jechman-mark.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f3f8fa;color:#193345;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{background:#fff;border:1px solid #dce5e9;border-radius:16px;padding:48px 40px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 32px #09283f0e}
    .logo{width:56px;height:56px;object-fit:contain;margin:0 auto 24px}
    h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-bottom:12px;color:#102d40}
    p{color:#526b7a;line-height:1.6;margin-bottom:28px;font-size:1rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;background:#102d40;color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:999px;font-size:1rem;transition:background .2s}
    .btn:hover{background:#1a425a}
    .secondary{display:block;margin-top:16px;color:#526b7a;font-size:.9rem}
    .secondary a{color:#087aa1;font-weight:700;text-underline-offset:3px}
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/jechman-mark.png" alt="JECHMAN" class="logo">
    <h1>Esta página no existe</h1>
    <p>El enlace que seguiste ya no está disponible o fue movido. Puedes volver al portal de JECHMAN y encontrar lo que necesitas desde ahí.</p>
    <a href="./" class="btn">Volver al inicio</a>
    <span class="secondary">
      ¿Necesitas cotizar? <a href="./#/contacto">Escríbenos</a> o llámanos al <a href="tel:+56962306924">+56 9 6230 6924</a>
    </span>
  </div>
  <script>
    // Si la URL tiene un hash que corresponde a una vista válida, redirigir a index
    const validViews = ['piscinas','electricidad','comercial','tienda','tinajas','jacuzzis','legal','color'];
    const hash = location.hash.replace('#/','').split('/')[0].split('?')[0];
    if(validViews.includes(hash)){
      location.replace('./#/' + location.hash.slice(2));
    }
  </script>
</body>
</html>
